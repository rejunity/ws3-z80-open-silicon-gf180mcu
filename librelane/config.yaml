meta:
  version: 3
  flow: Chip
  substituting_steps:

    # Render the layout after sealring insertion
    KLayout.Render: null
    +KLayout.SealRing: KLayout.Render

    # Disable KLayout DRC
    #KLayout.DRC: null
    #Checker.KLayoutDRC: null

    # Disable KLayout antenna check
    #KLayout.Antenna: null
    #Checker.KLayoutAntenna: null

    # Disable KLayout density check
    #KLayout.Density: null
    #Checker.KLayoutDensity: null

    # Save time during development
    # Enable for sign-off
    #OpenROAD.IRDropReport: null
    #Magic.DRC: null
    #Checker.MagicDRC: null
    #KLayout.XOR: null
    #Netgen.LVS: null
    #Checker.LVS: null

DESIGN_NAME: chip_top
VERILOG_FILES:
- dir::../src/chip_top.sv
- dir::../src/chip_core.sv
# RZ80, the Z80 core: rtl/ of https://github.com/rejunity/z80-from-schematics,
# unchanged (CERN-OHL-W-2.0); z80_top is the chip-level wrapper
- dir::../src/rz80/z80_top.v
- dir::../src/rz80/z80_core.v
- dir::../src/rz80/z80_timing.v
- dir::../src/rz80/z80_pla.v
- dir::../src/rz80/z80_execute.v
- dir::../src/rz80/z80_regfile.v
- dir::../src/rz80/z80_addr.v
- dir::../src/rz80/z80_alu.v
VERILOG_INCLUDE_DIRS:
- dir::../src/rz80

# Enable plugin for better SystemVerilog support
# USE_SLANG: True
# SLANG_ARGUMENTS: ['--keep-hierarchy']

# Slightly smaller file sizes
PRIMARY_GDSII_STREAMOUT_TOOL: klayout

# SDC files: one clock at the CLK pin at CLOCK_PERIOD, the pins held to the NMOS
# Z80's datasheet -- each parameter at the strictest of the 4, 6 and 8 MHz
# grades -- as RZ80's z80_chip flow holds its pins; generated by
# timing/pin_timing.py (`make sdc`; `make sdc-check` in CI)
PNR_SDC_FILE: dir::../timing/chip_top_nmos.sdc
SIGNOFF_SDC_FILE: dir::../timing/chip_top_nmos.sdc
FALLBACK_SDC: dir::../timing/chip_top_nmos.sdc

# Power / ground nets
VDD_NETS:
- VDD
GND_NETS:
- VSS

# We need to add gf180mcu_fd_io__bi_t
# due to the unused Y output for output only pads
IGNORE_DISCONNECTED_MODULES:
- gf180mcu_fd_io__bi_t
- gf180mcu_ws_ip__qrcode_id
- gf180mcu_ws_ip__shuttle_id
- gf180mcu_ws_ip__project_id
- gf180mcu_ws_ip__logo
- gf180mcu_ws_ip__marker

# depending on SLOT configuration
# PAD_SOUTH, PAD_EAST, PAD_NORTH, PAD_WEST are defined in one of the:
# - slot_1x1.yaml
# - slot_0p5x1.yaml
# - slot_0p5x0p5.yaml
# (slot_1x0p5.yaml has no Z80 pad mapping)

# Clock: one, at the CLK pin (the SDC's CLK); CTS builds its tree from the CLK
# pad's output. 50 ns (20 MHz, the CMOS Z84C0020's rate) is the core's goal; the
# NMOS grades, 4, 6 and 8 MHz, are what the pins are held to (the template's
# IO_DELAY_CONSTRAINT budget is not used)
CLOCK_PORT: clk_PAD
CLOCK_NET: clk_pad/Y
CLOCK_PERIOD: 50 # 20 MHz

# Setup is signed off at every corner, as hold is: the pins must meet the
# datasheet and the core its 50 ns at the slow and fast corners too (the PDK's
# default is the typical corners only)
TIMING_VIOLATION_CORNERS: ["*"]

# The pads' timing as RZ80 simulated them at transistor level (spice/pads/,
# spice/pads.py): the PDK's gf180mcu_fd_io libraries with bi_t, in_c and in_s
# re-measured as chip_top ties them, into the datasheet's 100 pF and with its
# slow edges (to 30 ns) -- where the PDK's own tables (to 20-33 pF, 1-5 ns
# edges) are extrapolated. The SDC's datasheet contract is repaired and signed
# off against the same pads timing/pin_timing.py checks. Their power tables
# are the PDK's, to 30 pF: at 100 pF the flow's power figure for the pads is
# extrapolated (negative), not a measurement.
PAD_LIBS:
  "*_tt_025C_5v00": [dir::../spice/pads/gf180mcu/gf180mcu_fd_io__tt_025C_5v00.lib]
  "*_ff_n40C_5v50": [dir::../spice/pads/gf180mcu/gf180mcu_fd_io__ff_n40C_5v50.lib]
  "*_ss_125C_4v50": [dir::../spice/pads/gf180mcu/gf180mcu_fd_io__ss_125C_4v50.lib]

# Increase density for more
# logic on your die
PL_TARGET_DENSITY_PCT: 20 # Z80: 20, template: 35
GRT_ALLOW_CONGESTION: true

# Plain buffers, no delay cells: LibreLane's fanout and port repairs otherwise
# pick the library's delay cells (dlyd_1, ~2 ns each at the typical corner) as
# buffers -- a chain of 20 of them on the data bus pads' inputs cost the first
# RZ80 run 40 ns of setup and stopped it (RSZ-2008 on bidir[5].pad/Y). RZ80's
# own GF180 flows exclude them for the same reason.
EXTRA_EXCLUDED_CELLS:
- "gf180mcu_fd_sc_mcu7t5v0__dly*"

# No buffering in the post-CTS setup repair: with the setup margin below, it
# goes on to rebuffer the nets the data bus pads drive into the core, and this
# OpenROAD stops there ([CRITICAL RSZ-2008] buffering pin bidir[n].pad/Y: wire
# step options empty). Sizing, pin swaps and cloning still run.
PL_RESIZER_SETUP_BUFFERING: False

# Z80 project specific FIXES --------------------------------------------------
# Fix HOLD violations
PL_RESIZER_HOLD_SLACK_MARGIN: 0.5 # default 0.1, wafer-space template: 0.35 ns
GRT_RESIZER_HOLD_SLACK_MARGIN: 1.0 # default 0.05, wafer-space template: 0.3 ns; the routed
# wires take up to 0.5 ns of the post-route repair's estimate off the pins' holds

PL_RESIZER_HOLD_MAX_BUFFER_PCT: 100 # default 50
GRT_RESIZER_HOLD_MAX_BUFFER_PCT: 100 # default 50

# Setup is signed off at every corner (TIMING_VIOLATION_CORNERS), and at the
# slow corner the routed wires cost the half-cycle paths -- the falling-edge
# samplers (read data, WAIT) into the core -- 2-3 ns over the placement
# estimate: the post-CTS repair aims that far above zero, and setup and hold
# are repaired again after global routing (sizing, swaps, cloning; no
# buffering, as after CTS)
PL_RESIZER_SETUP_SLACK_MARGIN: 3.0 # default 0.05 ns
RUN_POST_GRT_RESIZER_TIMING: True
GRT_RESIZER_SETUP_BUFFERING: False
GRT_RESIZER_SETUP_SLACK_MARGIN: 3.0 # default 0.025 ns

# The routed wires also leave weak core gates' edges at the slow corners past
# the 3 ns MAX_TRANSITION_CONSTRAINT (up to 6 ns at max_ss, inside the
# library's tables, so not extrapolated): slew, cap and fanout repaired again
# after global routing, which leaves 3.8 ns at worst
RUN_POST_GRT_DESIGN_REPAIR: True

# PL_RESIZER_ALLOW_SETUP_VIOS: True # default False
# GRT_RESIZER_ALLOW_SETUP_VIOS: True # default False

# Experimental option!
# PL_RESIZER_FIX_HOLD_FIRST: True # default False
# GRT_RESIZER_FIX_HOLD_FIRST: True # default False
# -----------------------------------------------------------------------------

# Allow a larger Y displacement
PL_MAX_DISPLACEMENT_Y: 200

# Fix antenna violations after DRT
DRT_ANTENNA_REPAIR_ITERS: 10
DRT_ANTENNA_REPAIR_MARGIN: 10 # %

# PDN
PDN_CFG: dir::pdn/pdn_cfg.tcl
PDN_ENABLE_PINS: False

# PDN - Straps
PDN_VWIDTH: 5
PDN_HWIDTH: 5
PDN_VSPACING: 1
PDN_HSPACING: 1
PDN_VPITCH: 75
PDN_HPITCH: 75

# PDN - Core ring
PDN_CORE_RING: True
# Maximum metal width without slotting: 30um
PDN_CORE_RING_VWIDTH: 25
PDN_CORE_RING_HWIDTH: 25
PDN_CORE_RING_CONNECT_TO_PADS: True
PDN_CORE_VERTICAL_LAYER: Metal4
PDN_CORE_HORIZONTAL_LAYER: Metal3
PDN_CORE_RING_CONNECT_TO_PAD_LAYERS: [Metal2]

# Do not error on magic DRC violations
# Note: Passing magic DRC is not required for the submission.
# However, it is recommended to fix or carefully review all violations.
ERROR_ON_MAGIC_DRC: False

# Prevent false positive DRC errors in I/O cells
MAGIC_GDS_FLATGLOB:
# For contacts
- "*_CDNS_*"
# Foundry provided SRAMs
- "*$$*"
- "M1_N*"
- "M1_P*"
- "M2_M1*"
- "M3_M2*"
- "nmos_5p0*"
- "nmos_1p2*"
- "pmos_5p0*"
- "pmos_1p2*"
- "via1_*"
- "ypass_gate*"
- "G_ring_*"
# These additional cells must be flattened to get rid of 3.3V devices
# (DUALGATE drawn into high-level cells)
- "dcap_103*"
- "din_*"
- "mux821_*"
- "rdummy_*"
- "pmoscap_*"
- "xdec_*"
- "ypredec*"
- "xpredec*"
- "prexdec_*"
- "xdec8_*"
- "xdec16_*"
- "xdec32_*"
- "sa_*"

# Since we cannot meet the minimum density limit on Metal2,
# ignore active metal on previous and subsequent layers
# (DM.5_DM.7 and DM.4_DM.6). Dummy metal is moved to active
# metal during the precheck.
KLAYOUT_FILLER_OPTIONS:
  Metal2_ignore_active: true

# Because we have multiple power pads for one power domain
MAGIC_EXT_UNIQUE: notopports

# Image render settings
KLAYOUT_RENDER_RESOLUTION: 2048
KLAYOUT_RENDER_OVERSAMPLING: 3
KLAYOUT_PROPERTIES: dir::gf180mcu_render.lyp

# DRC settings
# A high number of workers increases RAM usage,
# but can significantly improve the performance.
# workers * threads should equal the available
# hardware threads for a best possible utilization.

KLAYOUT_DRC_THREADS: 1

# "max" equals max hardware threads
KLAYOUT_DRC_OPTIONS:
  decks: "all,-antenna,-density,-cup" # disable CUP for now
  variant: ref::$PDK
  workers: max

KLAYOUT_DENSITY_OPTIONS:
  decks: "density"
  variant: ref::$PDK
  workers: max

KLAYOUT_ANTENNA_OPTIONS:
  decks: "antenna"
  variant: ref::$PDK
  workers: max
