name: CI

# The chip and its tests (tests/README.md).
#   every push:   the power and ground pads as in the wafer.space template
#                 (and, on main and nightly, as in the template's current main);
#                 RZ80's files and the flow's SDC in step with rz80/ and
#                 timing/; RZ80's iverilog tests of the
#                 RTL; the trace programs, pin scenarios and the pin sweep
#                 against perfectz80's recorded traces;
#                 Verilator: z80test, the BASICs, 14 tests of ZEXALL; the chip:
#                 cocotb on the RTL, RTL-to-GDS, sign-off, every pin's edge,
#                 load and fanout within its limits at every corner, cocotb on
#                 the gate-level netlist, wafer.space's precheck, the NMOS pin
#                 timing at 4, 6 and 8 MHz
#   main, nightly and on demand: all of ZEXDOC and ZEXALL (Verilator), in parts
#                 that each fit a job; nightly and on demand, the pin sweep's
#                 opcodes_reset group

on:
  push:
    branches:
      - "**"
    tags-ignore:
      - "**"
  pull_request:
  schedule:
    - cron: '0 3 * * *'          # 03:00 UTC
  workflow_dispatch:

concurrency:
  # the latest push cancels a run still going on the same branch or PR
  group: ci-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.ref }}-${{ github.event_name == 'schedule' && 'nightly' || 'push' }}
  cancel-in-progress: true

jobs:
  sync:
    name: RZ80's files in step with rz80/
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
      - name: scripts/sync_rz80.py --check
        run: make sync-check
      - name: The flow's SDC is what timing/pin_timing.py --write-sdc writes
        run: make sdc-check

  power-pads:
    name: Power and ground pads as in the wafer.space template
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - name: Against the template commit ws3 was made from (d99f6e1)
        run: make check-power-pads
      # wafer.space moving a supply pad upstream fails main and the nightly run
      - name: Against the template's current main
        if: github.ref == 'refs/heads/main' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: make check-power-pads-upstream

  rtl:
    name: RZ80's RTL tests (iverilog)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
      - name: Install iverilog
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends iverilog python3
      - name: Elaboration, bus controls, FUSE with the die's values, the X / Y corpus
        run: make rz80-elab rz80-bus rz80-fuse rz80-xyflags
      - name: Trace programs and pin scenarios vs perfectz80's recorded traces
        run: make rz80-traces

  sweep:
    name: Pin sweep against perfectz80 (iverilog) ${{ matrix.shard }}/4
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
      - name: Install iverilog
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends iverilog python3
      - name: Every opcode, timing class and pin event, half-cycle by half-cycle
        run: make rz80-sweep SWEEP_SHARD=${{ matrix.shard }}/4
      # RESET at every half-cycle of every opcode: 27,768 cases, about 10 more
      # minutes a shard; nightly, as RZ80 runs it
      - name: Group opcodes_reset
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: make rz80-sweep SWEEP_GROUPS=opcodes_reset SWEEP_SHARD=${{ matrix.shard }}/4
      - name: Upload the reports and any differences
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: sweep-${{ matrix.shard }}
          path: |
            build/rz80/event_sweep_*/report.md
            build/rz80/event_sweep_*/diff/
          if-no-files-found: ignore
          retention-days: 14

  z80test:
    name: z80test ${{ matrix.variant }} (Verilator)
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        variant: [z80doc, z80flags, z80memptr, z80full, z80ccf]
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
      - name: Install Verilator
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends build-essential python3 verilator
      - name: Patrik Rak's ${{ matrix.variant }} through the RTL; any failed test fails
        run: make rz80-z80test Z80TEST=${{ matrix.variant }}

  basic:
    name: NASCOM BASIC and Tiny BASIC (Verilator)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
      - name: Install Verilator
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends build-essential python3 verilator
      - name: The canned BASIC scripts through the RTL
        run: make rz80-basic

  zexall-subset:
    name: ZEXALL, 14 of its tests (Verilator)
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
      - name: Install Verilator
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends build-essential python3 verilator
      # RZ80's subset: block moves and compares, DDCB BIT / SET / RES / shifts,
      # RRD / RLD, NEG, DAA / CPL / SCF / CCF, 16-bit ADC / SBC
      - name: ZEXALL tests 12 0 56 57 52 53 54 55 10 11 8 27 59 62
        run: make rz80-zex ZEX=zexall ZEX_TESTS="12 0 56 57 52 53 54 55 10 11 8 27 59 62"

  zex:
    name: ${{ matrix.zex }} part ${{ matrix.part }} (Verilator)
    if: github.ref == 'refs/heads/main' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 360        # GitHub's limit: test 5 alone took 3 h 17 min and 4 h 30 min (23ab727)
    strategy:
      fail-fast: false
      # Each of ZEXDOC and ZEXALL runs 5.76 G instructions, 93.5 G clock phases
      # (the same in both: only the flag masks differ); Verilator on a GitHub
      # runner simulates 2.5-3.4 M phases a second (RZ80's 14-test job), so
      # all of one would take 8-10 hours. The parts are balanced by each test's
      # length: test 5, aluop a,<b,c,d,e,h,l,(hl),a>, is 40.0 G phases
      # alone (3.3-4.5 hours), test 6 20.3 G, the other two 16.6 G each.
      matrix:
        include:
          - {zex: zexdoc, part: 1, tests: "5"}
          - {zex: zexdoc, part: 2, tests: "6"}
          - {zex: zexdoc, part: 3, tests: "1 4 7 8 10 14 17 18 20 23 25 26 28 30 32 33 35 37 39 42 43 44 45 49 52 56 57 59 61 64 65 66"}
          - {zex: zexdoc, part: 4, tests: "0 2 3 9 11 12 13 15 16 19 21 22 24 27 29 31 34 36 38 40 41 46 47 48 50 51 53 54 55 58 60 62 63"}
          - {zex: zexall, part: 1, tests: "5"}
          - {zex: zexall, part: 2, tests: "6"}
          - {zex: zexall, part: 3, tests: "1 4 7 8 10 14 17 18 20 23 25 26 28 30 32 33 35 37 39 42 43 44 45 49 52 56 57 59 61 64 65 66"}
          - {zex: zexall, part: 4, tests: "0 2 3 9 11 12 13 15 16 19 21 22 24 27 29 31 34 36 38 40 41 46 47 48 50 51 53 54 55 58 60 62 63"}
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
      - name: Install Verilator
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends build-essential python3 verilator
      - name: ${{ matrix.zex }} tests ${{ matrix.tests }}
        run: make rz80-zex ZEX=${{ matrix.zex }} ZEX_TESTS="${{ matrix.tests }}"
      - name: Upload the log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.zex }}-part-${{ matrix.part }}
          path: build/rz80/zex/*.log
          retention-days: 14

  chip:
    runs-on: ubuntu-24.04
    name: The chip (RTL-to-GDS, sign-off, gate level)
    timeout-minutes: 350
    steps:
      - name: Maximize build space
        uses: AdityaGarg8/remove-unwanted-software@v5
        with:
          remove-dotnet: "true"
          remove-android: "true"
          remove-haskell: "true"
          remove-codeql: "true"
          remove-docker-images: "true"
      - uses: actions/checkout@v6
        with:
          submodules: recursive
      - name: Setup Nix
        uses: ./.github/actions/setup_nix
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          nix_cache_domain: ${{ vars.NIX_CACHE }}
          nix_public_key: ${{ vars.NIX_PUBLIC_KEY }}
      - name: Build with Nix
        uses: ./.github/actions/build_nix
        with:
          nix_system: x86_64-linux
      - name: Clone the PDK
        run: nix develop --command make clone-pdk
      - name: cocotb on the RTL (the chip's pads, signs of life, HALT to INT, the KC 85 capture)
        run: |
          nix develop --command make sim
          # cocotb also returns 0 upon failure
          ! grep failure cocotb/sim_build/results.xml
      - name: Whole programs on the RTL (cocotb)
        run: nix develop --command make sim-system
      - name: Implement the Chip
        run: nix develop --command make librelane-condensed
      - name: Sign-off (DRC, LVS, antenna, XOR, timing)
        if: success() || failure()
        run: |
          rc=0
          nix develop --command python3 tests/rz80/scripts/summary.py "$(ls -td librelane/runs/RUN_* | head -1)" > signoff.txt || rc=$?
          cat signoff.txt
          { echo '# Sign-off'; echo '```'; cat signoff.txt; echo '```'; } >> $GITHUB_STEP_SUMMARY
          echo "# Manufacturability" >> $GITHUB_STEP_SUMMARY
          cat librelane/runs/*/*-misc-reportmanufacturability/manufacturability.rpt >> $GITHUB_STEP_SUMMARY
          exit $rc
      - name: Every pin's edge, load and fanout within its limits, every corner (the cells' own; the pads' simulated range)
        if: success() || failure()
        run: |
          rc=0
          nix develop --command make check-drv > drv.txt || rc=$?
          cat drv.txt
          { echo '# Max slew, capacitance, fanout'; echo '```'; cat drv.txt; echo '```'; } >> $GITHUB_STEP_SUMMARY
          exit $rc
      - name: Print the hash
        if: success() || failure()
        run: shasum final/gds/*
      - name: Upload GDS
        if: success() || failure()
        uses: actions/upload-artifact@v7
        with:
          name: chip_gds
          path: final/gds/*
      - name: Upload the views (netlists, parasitics, GDS) for the transistor-level runs
        if: success() || failure()
        uses: actions/upload-artifact@v7
        with:
          name: chip_final
          path: |
            final/gds/
            final/nl/
            final/pnl/
            final/spef/
            final/metrics.json
          retention-days: 30
      - name: Upload image
        if: success() || failure()
        uses: actions/upload-artifact@v7
        with:
          name: chip_image
          path: final/render/*.png
      - name: cocotb on the gate-level netlist
        if: success() || failure()
        run: |
          nix develop --command make sim-gl
          # cocotb also returns 0 upon failure
          ! grep failure cocotb/sim_build/results.xml
      - name: Whole programs on the gate-level netlist (cocotb)
        if: success() || failure()
        run: nix develop --command make sim-system-gl
      - name: Trace programs and pin scenarios vs perfectz80's recorded traces, on the gate-level netlist
        if: success() || failure()
        run: nix develop --command make rz80-traces-gl
      - name: The pins against the NMOS Z80's datasheet at 2.5-8 MHz and the TRS-80, ZX80 / ZX81 and Spectrum clocks (OpenSTA, every corner)
        if: success() || failure()
        run: nix develop --command make pin-timing
      - name: wafer.space precheck (its own Nix shell)
        if: success() || failure()
        run: make precheck
