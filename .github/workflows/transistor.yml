          path: work/${{ matrix.corner }}/seg
          retention-days: 14
  figures:
    name: the pins, the AC parameters and the figures
    needs: [netlist, window6]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - name: The netlist and the RTL's reference
        uses: actions/download-artifact@v8
        with:
          name: transistor-netlist
          path: work
      - name: Every corner's windows
        uses: actions/download-artifact@v8
        with:
          pattern: transistor-*-6
          path: windows
      - name: Stitch the windows and draw the figures, each corner
        run: |
          rc=0
          for d in windows/transistor-*-6; do
            corner=$(basename "$d" | cut -d- -f2)
            mkdir -p work/$corner && cp -r "$d" work/$corner/seg
            python3 spice/chip.py ci --work work --corner $corner --steps stitch,figures --segment 6/6 || rc=1
          done
          exit $rc
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: transistor-results
          path: spice/chip/gf180mcu
          retention-days: 90
