      - uses: DeterminateSystems/magic-nix-cache-action@main
      - name: The PDK (cached)
        uses: actions/cache@v4
        with:
          path: gf180mcu
          key: ciel-gf180mcu-${{ env.PDK_COMMIT }}
      - name: Fetch the PDK (LibreLane's ciel)
        run: |
          [ -d gf180mcu/$PDK ] ||
