          tail -n 40 work/${{ matrix.corner }}/seg/*.log | grep -E "Total analysis|iterations|timepoints" || true
      - uses: actions/upload-artifact@v7
        with:
          name: transistor-${{ matrix.corner }}-3
          path: work/${{ matrix.corner }}/seg
          retention-days: 14
  window4:
    name: window 4 of 6 (${{ matrix.corner }})
    needs: window3
    runs-on: ubuntu-24.04
    timeout-minutes: 355
    strategy:
      fail-fast: false
      matrix:
