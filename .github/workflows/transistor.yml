      - uses: DeterminateSystems/magic-nix-cache-action@main
      - name: The PDK (cached)
        uses: actions/cache@v4
        with:
          path: gf180mcu
          key: ciel-gf180mcu-${{ env.PDK_COMMIT }}
      - name: Fetch the PDK (LibreLane's ciel)
        run: |
          [ -d gf180mcu/$PDK ] ||
            nix run $LIBRELANE#python3.pkgs.ciel -- enable $PDK_COMMIT --pdk-root gf180mcu --pdk $PDK --include-libraries all
      - name: The netlist and the RTL's reference
        uses: actions/download-artifact@v8
        with:
          name: transistor-netlist
          path: work
      - name: Windows 1-2 at ${{ matrix.corner }}
        uses: actions/download-artifact@v8
        with:
          name: transistor-${{ matrix.corner }}-2
          path: work/${{ matrix.corner }}/seg
      - name: Simulate window 3 of 6
        run: |
          python3 spice/chip.py ci --work work --corner ${{ matrix.corner }} --threads 4 \
