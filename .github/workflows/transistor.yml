        run: |
          [ -d gf180mcu/$PDK ] ||
            nix run $LIBRELANE#python3.pkgs.ciel -- enable $PDK_COMMIT --pdk-root gf180mcu --pdk $PDK --include-libraries all
      - name: The netlist and the RTL's reference
        uses: actions/download-artifact@v8
        with:
          name: transistor-netlist
          path: work
      - name: Windows 1-10 at ${{ matrix.corner }}
        uses: actions/download-artifact@v8
        with:
          name: transistor-${{ matrix.corner }}-10
          path: work/${{ matrix.corner }}/seg
      - name: Simulate window 11 of 12
        run: |
          python3 spice/chip.py ci --work work --corner ${{ matrix.corner }} --threads 4 \
            --steps simulate --segment 11/12
          tail -n 40 work/${{ matrix.corner }}/seg/*.log | grep -E "Total analysis|iterations|timepoints" || true
      - uses: actions/upload-artifact@v7
        with:
          name: transistor-${{ matrix.corner }}-11
          path: work/${{ matrix.corner }}/seg
          retention-days: 14
  window12:
    name: window 12 of 12 (${{ matrix.corner }})
    needs: window11
    runs-on: ubuntu-24.04
    timeout-minutes: 355
    strategy:
      fail-fast: false
      matrix:
        corner: ${{ fromJSON(inputs.corners) }}
    steps:
      - uses: actions/checkout@v6
      - uses: DeterminateSystems/nix-installer-action@main
        with:
          extra-conf: |
            extra-substituters = https://nix-cache.fossi-foundation.org
            extra-trusted-public-keys = nix-cache.fossi-foundation.org:3+K59iFwXqKsL7BNu6Guy0v+uTlwsxYQxjspXzqLYQs=
            extra-experimental-features = nix-command flakes
      - uses: DeterminateSystems/magic-nix-cache-action@main
      - name: The PDK (cached)
        uses: actions/cache@v4
        with:
          path: gf180mcu
          key: ciel-gf180mcu-${{ env.PDK_COMMIT }}
      - name: Fetch the PDK (LibreLane's ciel)
        run: |
          [ -d gf180mcu/$PDK ] ||
            nix run $LIBRELANE#python3.pkgs.ciel -- enable $PDK_COMMIT --pdk-root gf180mcu --pdk $PDK --include-libraries all
      - name: The netlist and the RTL's reference
        uses: actions/download-artifact@v8
        with:
          name: transistor-netlist
          path: work
      - name: Windows 1-11 at ${{ matrix.corner }}
        uses: actions/download-artifact@v8
        with:
          name: transistor-${{ matrix.corner }}-11
          path: work/${{ matrix.corner }}/seg
      - name: Simulate window 12 of 12
        run: |
          python3 spice/chip.py ci --work work --corner ${{ matrix.corner }} --threads 4 \
            --steps simulate --segment 12/12
          tail -n 40 work/${{ matrix.corner }}/seg/*.log | grep -E "Total analysis|iterations|timepoints" || true
      - uses: actions/upload-artifact@v7
        with:
          name: transistor-${{ matrix.corner }}-12
          path: work/${{ matrix.corner }}/seg
          retention-days: 14
  figures:
    name: the pins, the AC parameters and the figures
    needs: [netlist, window12]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - name: The netlist and the RTL's reference
        uses: actions/download-artifact@v8
        with:
          name: transistor-netlist
          path: work
      - name: Every corner's windows
        uses: actions/download-artifact@v8
        with:
          pattern: transistor-*-12
          path: windows
      - name: Stitch the windows and draw the figures, each corner
        run: |
          rc=0
          for d in windows/transistor-*-12; do
            corner=$(basename "$d" | cut -d- -f2)
            mkdir -p work/$corner && cp -r "$d" work/$corner/seg
            python3 spice/chip.py ci --work work --corner $corner --steps stitch,figures --segment 12/12 || rc=1
          done
          exit $rc
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: transistor-results
          path: spice/chip/gf180mcu
          retention-days: 90

  # The figures into docs/transistor/ on main, with where they came from: the
  # one job that may write, as github-actions[bot] (no personal identity or
  # address), "[skip ci]" so the figures alone start no CI run
  publish:
    name: the results into docs/transistor/
    needs: [netlist, figures]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
      - uses: actions/download-artifact@v8
        with:
          name: transistor-results
          path: ${{ runner.temp }}/transistor-results
      - name: docs/transistor/ from the results
        run: |
          python3 -I scripts/transistor_docs.py "$RUNNER_TEMP/transistor-results" --out docs/transistor \
            --run "$GITHUB_RUN_ID" --commit "${{ needs.netlist.outputs.gds_sha }}" \
            --gds-run "${{ needs.netlist.outputs.gds_run }}" --repo "$GITHUB_REPOSITORY" || rc=$?
          cat docs/transistor/README.md >> "$GITHUB_STEP_SUMMARY"
          echo "rc=${rc:-0}" >> "$GITHUB_ENV"
      - name: Commit and push to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A docs/transistor
          if git diff --cached --quiet; then echo "docs/transistor/ unchanged"; exit "$rc"; fi
          sha=${{ needs.netlist.outputs.gds_sha }}
          git commit -q -m "docs/transistor: the chip at transistor level, ${sha:0:7} (run $GITHUB_RUN_ID) [skip ci]"
          for try in 1 2 3; do
            git push origin HEAD:main && exit "$rc"
            git pull --rebase origin main
          done
          echo "push to main failed 3 times"; exit 1

