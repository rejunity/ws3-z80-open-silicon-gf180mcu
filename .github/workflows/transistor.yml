# The whole chip at transistor level (spice/chip.py, RZ80's asic/spice/chip.py on
# chip_top), on demand, apart from CI. The GDS of main's latest successful CI
# run, extracted to its transistors with Magic; the test program -- power-up,
# RESET, LD A,5Ah / LD (8000h),A / OUT (42h),A / IN A,(43h) / HALT at 4 MHz,
# 15 ns edges, 100 pF on every pin -- in ngspice at each corner, in 12
# windows of about 1.1 us, one job each (a GitHub job stops at 6 hours, and on
# this machine one 2.4 us window ran past 3.9 hours): every window starts
# from the node voltages the one before ended with. Then the pins against the
# RTL, every AC parameter of the Z8400's datasheet on every cycle that has it,
# and the figures, as the artifact transistor-results (spice/chip/gf180mcu/:
# tt's; the other corners' in <corner>/); the publish job commits them to
# main's docs/transistor/ with where they came from.
name: Transistor

on:
  workflow_dispatch:
    inputs:
      corners:
        description: corners, as a JSON list
        default: '["tt", "ss", "ff"]'

permissions:
  contents: read
  actions: read           # main's latest CI run, for the chip's GDS

concurrency:
  group: transistor
  cancel-in-progress: false

env:
  LIBRELANE: github:librelane/librelane/99148a9c1e648cdfdb9d7b772481af32e0dfbe8b   # the template's (flake.lock)
  PDK_COMMIT: 792ef67037d74c8c51811eab3ce23cf793491296                            # the Makefile's
  PDK_ROOT: ${{ github.workspace }}/gf180mcu
  PDK: gf180mcuD

defaults:
  run:
    shell: bash

jobs:
  pads:
    name: the pads at transistor level, on this PDK, against spice/pads/gf180mcu/
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
      - uses: DeterminateSystems/nix-installer-action@main
        with:
          extra-conf: |
            extra-substituters = https://nix-cache.fossi-foundation.org
            extra-trusted-public-keys = nix-cache.fossi-foundation.org:3+K59iFwXqKsL7BNu6Guy0v+uTlwsxYQxjspXzqLYQs=
            extra-experimental-features = nix-command flakes
      - uses: DeterminateSystems/magic-nix-cache-action@main
      - name: The PDK (cached)
        uses: actions/cache@v4
        with:
          path: gf180mcu
          key: ciel-gf180mcu-${{ env.PDK_COMMIT }}
      - name: Fetch the PDK (LibreLane's ciel)
        run: |
          [ -d gf180mcu/$PDK ] ||
            nix run $LIBRELANE#python3.pkgs.ciel -- enable $PDK_COMMIT --pdk-root gf180mcu --pdk $PDK --include-libraries all
      - name: pads.py --check (every measurement within pads.py's tolerances)
        run: python3 spice/pads.py gf180mcu --pdk-root "$PWD/gf180mcu/ciel" --jobs 4 --out build/pads-check --check spice/pads/gf180mcu/pads.json

  netlist:
    name: the chip extracted, and the RTL's reference
    runs-on: ubuntu-24.04
    # Magic extracts the flat chip, coupling capacitance included, in about an
    # hour here (8 cores, one used); a GitHub runner is slower
    timeout-minutes: 355
    outputs:
      gds_run: ${{ steps.gds.outputs.run }}
      gds_sha: ${{ steps.gds.outputs.sha }}
    steps:
      - uses: actions/checkout@v6
      - uses: DeterminateSystems/nix-installer-action@main
        with:
          extra-conf: |
            extra-substituters = https://nix-cache.fossi-foundation.org
            extra-trusted-public-keys = nix-cache.fossi-foundation.org:3+K59iFwXqKsL7BNu6Guy0v+uTlwsxYQxjspXzqLYQs=
            extra-experimental-features = nix-command flakes
      - uses: DeterminateSystems/magic-nix-cache-action@main
      - name: The PDK (cached)
        uses: actions/cache@v4
        with:
          path: gf180mcu
          key: ciel-gf180mcu-${{ env.PDK_COMMIT }}
      - name: Fetch the PDK (LibreLane's ciel)
        run: |
          [ -d gf180mcu/$PDK ] ||
            nix run $LIBRELANE#python3.pkgs.ciel -- enable $PDK_COMMIT --pdk-root gf180mcu --pdk $PDK --include-libraries all
      - name: The chip's GDS, from main's latest successful CI run
        id: gds
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          read -r id sha < <(gh run list -R "$GITHUB_REPOSITORY" --workflow ci.yml --branch main --status success \
                 --limit 1 --json databaseId,headSha -q '.[0] | "\(.databaseId) \(.headSha)"')
          gh run download "$id" -R "$GITHUB_REPOSITORY" -n chip_final -D final
          echo "CI run $id ($sha): $(ls -l final/gds/chip_top.gds)" | tee -a "$GITHUB_STEP_SUMMARY"
          echo "run=$id" >> "$GITHUB_OUTPUT"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
      - name: iverilog (the RTL's reference)
        run: sudo apt-get update && sudo apt-get install -y iverilog
      - name: Extract the layout (Magic) and run the RTL
        run: python3 spice/chip.py ci --work work --gds final/gds/chip_top.gds --steps extract,reference
      - uses: actions/upload-artifact@v7
        with:
          name: transistor-netlist
          path: |
            work/z80_chip.spice
            work/ref.txt
          retention-days: 14
  window1:
    name: window 1 of 12 (${{ matrix.corner }})
    needs: netlist
    runs-on: ubuntu-24.04
    timeout-minutes: 355
    strategy:
      fail-fast: false
      matrix:
        corner: ${{ fromJSON(inputs.corners) }}
    steps:
      - uses: actions/checkout@v6
      - uses: DeterminateSystems/nix-installer-action@main
